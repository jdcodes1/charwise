  <rect x="5" y="8" width="22" height="7" rx="2.5" fill="#7c2648" />
  <rect x="5" y="17" width="22" height="7" rx="2.5" fill="#1e6d49" />
  <rect x="8.5" y="9.5" width="4.5" height="4" rx="1.25" fill="#ffb6cc" />
  <rect x="8.5" y="18.5" width="4.5" height="4" rx="1.25" fill="#96e6be" />
</svg>
